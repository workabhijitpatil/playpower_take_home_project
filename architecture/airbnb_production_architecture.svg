<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960" style="background:#0F172A; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="50%" stop-color="#E00B41" />
      <stop offset="100%" stop-color="#D70466" />
    </linearGradient>

    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="storageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glowCoral" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8" />
    </marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF385C" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- TITLE BANNER -->
  <rect x="40" y="30" width="1320" height="70" rx="14" fill="url(#headerGrad)" filter="url(#shadow)" />
  <text x="70" y="73" fill="#FFFFFF" font-size="26" font-weight="bold" letter-spacing="0.5">Vacation-Rental Marketplace — Production Scale Architecture</text>
  <text x="1000" y="73" fill="#FFE4E6" font-size="14" font-weight="600">High Availability · Elastic Scale · Sub-50ms Latency</text>

  <!-- ==================== TIER 1: CLIENT & EDGE ==================== -->
  <g id="tier-edge">
    <rect x="40" y="125" width="1320" height="135" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <text x="65" y="152" fill="#38BDF8" font-size="13" font-weight="bold" letter-spacing="1">TIER 1: GLOBAL CLIENTS &amp; EDGE CACHING LAYER</text>

    <!-- Desktop Web -->
    <rect x="65" y="170" width="230" height="70" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <text x="180" y="200" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Desktop Web</text>
    <text x="180" y="222" fill="#94A3B8" font-size="11" text-anchor="middle">Next.js 16 (App Router / SSR)</text>

    <!-- Mobile Web / Native -->
    <rect x="325" y="170" width="230" height="70" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <text x="440" y="200" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Mobile Apps &amp; PWA</text>
    <text x="440" y="222" fill="#94A3B8" font-size="11" text-anchor="middle">iOS / Android / React Native</text>

    <!-- Anycast Edge CDN -->
    <rect x="585" y="170" width="460" height="70" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
    <text x="815" y="198" fill="#FBBF24" font-size="14" font-weight="bold" text-anchor="middle">Global Anycast CDN &amp; WAF (Cloudflare / CloudFront)</text>
    <text x="815" y="222" fill="#94A3B8" font-size="11" text-anchor="middle">Edge Caching · DDoS Shield · TLS 1.3 · WebP/AVIF Delivery · Rate Guard</text>

    <!-- DNS / Global Traffic -->
    <rect x="1075" y="170" width="260" height="70" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
    <text x="1205" y="200" fill="#34D399" font-size="14" font-weight="bold" text-anchor="middle">Route53 / Geo-DNS</text>
    <text x="1205" y="222" fill="#94A3B8" font-size="11" text-anchor="middle">Latency-based Global Routing</text>
  </g>

  <!-- Connectors Tier 1 to Tier 2 -->
  <line x1="815" y1="240" x2="815" y2="280" stroke="#FF385C" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrowCoral)" />

  <!-- ==================== TIER 2: API GATEWAY & SECURITY ==================== -->
  <g id="tier-gateway">
    <rect x="40" y="280" width="1320" height="115" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <text x="65" y="307" fill="#F43F5E" font-size="13" font-weight="bold" letter-spacing="1">TIER 2: API GATEWAY &amp; SECURITY POLICY TIER</text>

    <!-- ALB -->
    <rect x="65" y="322" width="260" height="55" rx="8" fill="#0F172A" stroke="#64748B" stroke-width="1.5" />
    <text x="195" y="347" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">AWS ALB / Envoy Proxy</text>
    <text x="195" y="365" fill="#94A3B8" font-size="10" text-anchor="middle">Layer 7 SSL Termination &amp; Health Checks</text>

    <!-- API Gateway Core -->
    <rect x="355" y="322" width="370" height="55" rx="8" fill="#0F172A" stroke="#FF385C" stroke-width="2" />
    <text x="540" y="347" fill="#FF385C" font-size="14" font-weight="bold" text-anchor="middle">API Gateway (Kong / Envoy)</text>
    <text x="540" y="365" fill="#94A3B8" font-size="10" text-anchor="middle">gRPC Transcoding · Auth Context · Request Routing</text>

    <!-- Rate Limiter -->
    <rect x="755" y="322" width="270" height="55" rx="8" fill="#0F172A" stroke="#EAB308" stroke-width="1.5" />
    <text x="890" y="347" fill="#FDE047" font-size="13" font-weight="bold" text-anchor="middle">Token Bucket Rate Limiter</text>
    <text x="890" y="365" fill="#94A3B8" font-size="10" text-anchor="middle">Anti-Scraping / Burst Defense</text>

    <!-- Auth Service -->
    <rect x="1055" y="322" width="280" height="55" rx="8" fill="#0F172A" stroke="#A855F7" stroke-width="1.5" />
    <text x="1195" y="347" fill="#C084FC" font-size="13" font-weight="bold" text-anchor="middle">Identity &amp; Session Service</text>
    <text x="1195" y="365" fill="#94A3B8" font-size="10" text-anchor="middle">JWT Verification · OAuth2 · RBAC</text>
  </g>

  <!-- Connectors Tier 2 to Tier 3 -->
  <line x1="540" y1="377" x2="540" y2="415" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== TIER 3: MICROSERVICES DOMAIN LAYER ==================== -->
  <g id="tier-microservices">
    <rect x="40" y="415" width="1320" height="155" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <text x="65" y="442" fill="#A855F7" font-size="13" font-weight="bold" letter-spacing="1">TIER 3: DOMAIN MICROSERVICES (KUBERNETES EKS / AUTOSCALED)</text>

    <!-- Listings Service -->
    <rect x="65" y="460" width="195" height="92" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <text x="162" y="488" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Listings Service</text>
    <text x="162" y="508" fill="#94A3B8" font-size="10" text-anchor="middle">Metadata · Amenities</text>
    <text x="162" y="526" fill="#38BDF8" font-size="10" font-weight="semibold" text-anchor="middle">Go / gRPC</text>

    <!-- Search Service -->
    <rect x="280" y="460" width="195" height="92" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <text x="377" y="488" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Search &amp; Discovery</text>
    <text x="377" y="508" fill="#94A3B8" font-size="10" text-anchor="middle">Geospatial · Filters</text>
    <text x="377" y="526" fill="#38BDF8" font-size="10" font-weight="semibold" text-anchor="middle">Elasticsearch / Node</text>

    <!-- Booking Service -->
    <rect x="495" y="460" width="205" height="92" rx="10" fill="#0F172A" stroke="#FF385C" stroke-width="2" />
    <text x="597" y="488" fill="#FF385C" font-size="13" font-weight="bold" text-anchor="middle">Reservation Engine</text>
    <text x="597" y="508" fill="#94A3B8" font-size="10" text-anchor="middle">Distributed Redlock</text>
    <text x="597" y="526" fill="#FF385C" font-size="10" font-weight="semibold" text-anchor="middle">Zero Double-Booking</text>

    <!-- Dynamic Pricing -->
    <rect x="720" y="460" width="195" height="92" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
    <text x="817" y="488" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Dynamic Pricing</text>
    <text x="817" y="508" fill="#94A3B8" font-size="10" text-anchor="middle">Seasonal Yield · Fees</text>
    <text x="817" y="526" fill="#34D399" font-size="10" font-weight="semibold" text-anchor="middle">ML Inference / Python</text>

    <!-- Payment Service -->
    <rect x="935" y="460" width="195" height="92" rx="10" fill="#0F172A" stroke="#EAB308" stroke-width="1.5" />
    <text x="1032" y="488" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Payment &amp; Escrow</text>
    <text x="1032" y="508" fill="#94A3B8" font-size="10" text-anchor="middle">Stripe / UPI / Payouts</text>
    <text x="1032" y="526" fill="#FACC15" font-size="10" font-weight="semibold" text-anchor="middle">PCI-DSS Compliant</text>

    <!-- Media Pipeline -->
    <rect x="1150" y="460" width="185" height="92" rx="10" fill="#0F172A" stroke="#EC4899" stroke-width="1.5" />
    <text x="1242" y="488" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Media Pipeline</text>
    <text x="1242" y="508" fill="#94A3B8" font-size="10" text-anchor="middle">Resize · BlurHash</text>
    <text x="1242" y="526" fill="#F472B6" font-size="10" font-weight="semibold" text-anchor="middle">Lambda / S3 Events</text>
  </g>

  <!-- Connectors Tier 3 to Event Bus -->
  <line x1="597" y1="552" x2="597" y2="590" stroke="#FF385C" stroke-width="2" marker-end="url(#arrowCoral)" />

  <!-- ==================== TIER 4: ASYNC EVENT STREAM ==================== -->
  <g id="tier-events">
    <rect x="40" y="590" width="1320" height="70" rx="14" fill="#0F172A" stroke="#6366F1" stroke-width="2" filter="url(#shadow)" />
    <text x="65" y="618" fill="#818CF8" font-size="12" font-weight="bold" letter-spacing="1">EVENT BUS &amp; STREAMING (APACHE KAFKA / AWS MSK)</text>
    <text x="65" y="640" fill="#E2E8F0" font-size="12">Topics: <tspan fill="#38BDF8">booking.created</tspan> · <tspan fill="#34D399">payment.settled</tspan> · <tspan fill="#FBBF24">listing.indexed</tspan> · <tspan fill="#F472B6">guest.notification</tspan> · <tspan fill="#C084FC">audit.telemetry</tspan></text>
    <text x="1050" y="632" fill="#94A3B8" font-size="11" text-anchor="middle">Decoupled · Exactly-Once Semantics · Event Sourcing</text>
  </g>

  <!-- Connector Event Bus to Tier 5 -->
  <line x1="700" y1="660" x2="700" y2="690" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== TIER 5: DISTRIBUTED DATA & STORAGE ==================== -->
  <g id="tier-storage">
    <rect x="40" y="690" width="1320" height="135" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <text x="65" y="717" fill="#10B981" font-size="13" font-weight="bold" letter-spacing="1">TIER 5: DISTRIBUTED DATA, CACHING &amp; STORAGE TIER</text>

    <!-- PostgreSQL Primary -->
    <rect x="65" y="732" width="240" height="75" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
    <text x="185" y="760" fill="#34D399" font-size="13" font-weight="bold" text-anchor="middle">Aurora PostgreSQL (Primary)</text>
    <text x="185" y="780" fill="#94A3B8" font-size="10" text-anchor="middle">ACID Transactions · Multi-AZ</text>
    <text x="185" y="796" fill="#64748B" font-size="9" text-anchor="middle">Bookings · Users · Listings</text>

    <!-- Read Replicas -->
    <rect x="325" y="732" width="240" height="75" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
    <text x="445" y="760" fill="#34D399" font-size="13" font-weight="bold" text-anchor="middle">Geo Read Replicas</text>
    <text x="445" y="780" fill="#94A3B8" font-size="10" text-anchor="middle">PgBouncer Connection Pools</text>
    <text x="445" y="796" fill="#64748B" font-size="9" text-anchor="middle">Sub-5ms Query Offload</text>

    <!-- Redis Cluster -->
    <rect x="585" y="732" width="240" height="75" rx="10" fill="#0F172A" stroke="#EF4444" stroke-width="1.5" />
    <text x="705" y="760" fill="#F87171" font-size="13" font-weight="bold" text-anchor="middle">Redis Cluster (ElastiCache)</text>
    <text x="705" y="780" fill="#94A3B8" font-size="10" text-anchor="middle">Availability Calendar Matrices</text>
    <text x="705" y="796" fill="#64748B" font-size="9" text-anchor="middle">Distributed Locks (Redlock)</text>

    <!-- Elasticsearch -->
    <rect x="845" y="732" width="240" height="75" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <text x="965" y="760" fill="#38BDF8" font-size="13" font-weight="bold" text-anchor="middle">Elasticsearch / OpenSearch</text>
    <text x="965" y="780" fill="#94A3B8" font-size="10" text-anchor="middle">Geospatial Indexing · Facets</text>
    <text x="965" y="796" fill="#64748B" font-size="9" text-anchor="middle">Listing Keyword Queries</text>

    <!-- AWS S3 Object Storage -->
    <rect x="1105" y="732" width="230" height="75" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
    <text x="1220" y="760" fill="#FBBF24" font-size="13" font-weight="bold" text-anchor="middle">AWS S3 Media Bucket</text>
    <text x="1220" y="780" fill="#94A3B8" font-size="10" text-anchor="middle">Multi-Tier Storage Class</text>
    <text x="1220" y="796" fill="#64748B" font-size="9" text-anchor="middle">CloudFront Direct Ingestion</text>
  </g>

  <!-- ==================== TIER 6: DEVOPS & OBSERVABILITY ==================== -->
  <g id="tier-devops">
    <rect x="40" y="845" width="1320" height="85" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="65" y="872" fill="#94A3B8" font-size="12" font-weight="bold" letter-spacing="1">TIER 6: CI/CD DEPLOYMENT &amp; OBSERVABILITY PIPELINE</text>
    
    <text x="65" y="902" fill="#E2E8F0" font-size="12">
      <tspan font-weight="bold" fill="#38BDF8">Infrastructure as Code:</tspan> Terraform / Helm · 
      <tspan font-weight="bold" fill="#34D399">Deployment:</tspan> ArgoCD GitOps (Canary &amp; Blue/Green) · 
      <tspan font-weight="bold" fill="#FBBF24">Telemetry:</tspan> OpenTelemetry Distributed Tracing · Datadog APM · Prometheus &amp; Grafana Alerts
    </text>
    <text x="1240" y="902" fill="#64748B" font-size="11" text-anchor="end">Production SLA: 99.99% Availability</text>
  </g>
</svg>
